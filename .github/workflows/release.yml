name: Release

# Publishes the kit packages to npm when a version tag such as v0.1.0 is pushed.
# Authentication is npm trusted publishing (OIDC): no npm token is stored anywhere.
# Each package must list this repository and this workflow file as its trusted publisher on npmjs.com.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older npm.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches every package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in core system-one-client templates cli; do
            actual="$(node -p "require('./packages/${pkg}/package.json').version")"
            if [ "$actual" != "$version" ]; then
              echo "packages/${pkg} is at ${actual}, the tag says ${version}" >&2
              exit 1
            fi
          done

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # pnpm pack turns workspace: and catalog: ranges into real versions. npm publish then
      # uploads each tarball with a provenance statement. Order follows the dependencies.
      - name: Publish core, system-one-client, templates, cli
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p .release
          for pkg in core system-one-client templates cli; do
            name="@bandwise/${pkg}"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on npm, skipping"
              continue
            fi
            (cd "packages/${pkg}" && pnpm pack --pack-destination ../../.release)
            npm publish ".release/bandwise-${pkg}-${version}.tgz" --provenance --access public
          done
